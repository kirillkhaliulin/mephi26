<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход в аккаунт</title>
  <style>
    :root {
      --accent: #8b5cf6;
      --accent-light: #c4b5fd;
      --dark: #101225;
      --text: #f8fafc;
      --muted: #b7bfd4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.34), transparent 28%),
        radial-gradient(circle at 82% 72%, rgba(139, 92, 246, 0.45), transparent 33%),
        linear-gradient(135deg, #0a1024 0%, #16133a 48%, #24124a 100%);
    }

    body::before,
    body::after {
      position: fixed;
      z-index: 0;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      content: "";
      filter: blur(2px);
      opacity: 0.65;
    }

    body::before {
      top: -95px;
      right: -75px;
      background: linear-gradient(135deg, #f472b6, #8b5cf6);
    }

    body::after {
      bottom: -120px;
      left: -80px;
      background: linear-gradient(135deg, #22d3ee, #3b82f6);
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: min(100%, 430px);
      padding: 42px 38px 34px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 28px;
      background: rgba(15, 19, 47, 0.70);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px);
    }

    .logo {
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 20px;
      color: #ffffff;
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #8b5cf6 55%, #ec4899);
      box-shadow: 0 12px 25px rgba(139, 92, 246, 0.35);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 30px;
      line-height: 1.2;
    }

    .subtitle {
      margin: 12px 0 30px;
      color: var(--muted);
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #e8eaf4;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border: 1px solid rgba(196, 181, 253, 0.34);
      border-radius: 14px;
      outline: none;
      color: var(--text);
      font: inherit;
      background: rgba(255, 255, 255, 0.09);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    input::placeholder {
      color: #aeb5cb;
    }

    input:focus {
      border-color: var(--accent-light);
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.24);
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 2px 0 24px;
      color: var(--muted);
      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .remember input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }

    a {
      color: #c4b5fd;
      text-decoration: none;
    }

    a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    button {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
      background: linear-gradient(90deg, #06b6d4, #6366f1 48%, #a855f7);
      box-shadow: 0 14px 28px rgba(99, 102, 241, 0.32);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    button:hover {
      filter: brightness(1.12);
      box-shadow: 0 18px 34px rgba(99, 102, 241, 0.48);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .register {
      margin: 25px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .login-card {
        padding: 34px 24px 28px;
        border-radius: 22px;
      }

      .options {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="logo" aria-hidden="true">K</div>
    <h1>С возвращением</h1>
    <p class="subtitle">Введите данные аккаунта, чтобы продолжить.</p>

    <form action="login.php" method="post">
      <div class="field">
        <label for="login">Логин</label>
        <input id="login" name="login" type="text" placeholder="Введите логин" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="pwd">Пароль</label>
        <input id="pwd" name="pwd" type="password" placeholder="Введите пароль" autocomplete="current-password" required>
      </div>

      <div class="options">
        <label class="remember" for="remember">
          <input id="remember" name="remember" type="checkbox">
          Запомнить меня
        </label>
        <a href="#">Забыли пароль?</a>
      </div>

      <button type="submit">Войти</button>
    </form>

    <p class="register">Нет аккаунта? <a href="#">Зарегистрироваться</a></p>
  </main>
</body>
</html>
